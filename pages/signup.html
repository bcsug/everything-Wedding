<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Wedding Planner</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #6b5b95 0%, #4a6b88 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .signup-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 100%;
            max-width: 500px;
            position: relative;
            overflow: hidden;
        }

        .signup-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #6b5b95, #4a6b88);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo i {
            font-size: 2.5rem;
            color: #6b5b95;
            margin-bottom: 10px;
        }

        .logo h1 {
            color: #333;
            font-size: 1.5rem;
            font-weight: 600;
        }

        h2 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            background: #f8f9fa;
            font-family: 'Poppins', sans-serif;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #6b5b95;
            background: white;
            box-shadow: 0 0 0 3px rgba(107, 91, 149, 0.1);
        }

        .user-type-fields {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            border: 2px solid #e9ecef;
            display: none;
        }

        .user-type-fields.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .password-strength {
            margin-top: 5px;
            font-size: 0.8rem;
        }

        .strength-weak { color: #dc3545; }
        .strength-medium { color: #ffc107; }
        .strength-strong { color: #28a745; }

        .signup-button {
            width: 100%;
            padding: 14px;
            border: none;
            background: linear-gradient(135deg, #6b5b95, #4a6b88);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .signup-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(107, 91, 149, 0.3);
        }

        .signup-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            color: #dc3545;
            font-size: 0.85rem;
            margin-top: 5px;
            display: none;
            padding: 10px;
            background: #f8d7da;
            border-radius: 8px;
            border-left: 4px solid #dc3545;
        }

        .success-message {
            color: #28a745;
            font-size: 0.85rem;
            margin-top: 5px;
            display: none;
            padding: 10px;
            background: #d4edda;
            border-radius: 8px;
            border-left: 4px solid #28a745;
        }

        .loading-message {
            font-size: 0.9rem;
            color: #666;
            text-align: center;
            margin: 15px 0;
            display: none;
        }

        .login-link {
            text-align: center;
            margin-top: 25px;
            color: #666;
            font-size: 0.9rem;
        }

        .login-link a {
            color: #6b5b95;
            text-decoration: none;
            font-weight: 500;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .terms {
            font-size: 0.8rem;
            color: #666;
            text-align: center;
            margin-top: 20px;
            line-height: 1.4;
        }

        .terms a {
            color: #6b5b95;
            text-decoration: none;
        }

        .terms a:hover {
            text-decoration: underline;
        }

        .disclaimer {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 10px;
            padding: 15px;
            margin: 20px 0;
            font-size: 0.85rem;
            color: #856404;
        }

        .disclaimer input {
            margin-right: 8px;
        }

        .disclaimer label {
            font-weight: 500;
            cursor: pointer;
        }

        @media (max-width: 480px) {
            .signup-container {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <div class="logo">
            <i class="fas fa-ring"></i>
            <h1>Wedding Planner</h1>
        </div>

        <h2>Create Your Account</h2>
        <p class="subtitle">Join thousands of couples and vendors creating unforgettable weddings</p>

        <form id="signup-form">
            <!-- User Type Selection -->
            <div class="form-group">
                <label for="user-type">Account Type *</label>
                <select id="user-type" required>
                    <option value="">Select Account Type</option>
                    <option value="client">Client - Planning a Wedding</option>
                    <option value="vendor">Vendor - Business Account</option>
                </select>
            </div>

            <!-- Common Contact Fields -->
            <div class="form-group">
                <label for="business-name">Business/Individual Name *</label>
                <input type="text" id="business-name" placeholder="Enter your business name or full name" required>
                <div class="error-message" id="business-name-error"></div>
            </div>

            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" placeholder="Enter your email" required>
                <div class="error-message" id="email-error"></div>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number *</label>
                <input type="tel" id="phone" placeholder="Enter your phone number" required>
                <div class="error-message" id="phone-error"></div>
            </div>

            <!-- Dynamic Fields based on User Type -->
            
            <!-- Client Fields - Only Wedding Date -->
            <div class="user-type-fields" id="client-fields">
                <h4 style="color: #6b5b95; margin-bottom: 15px; text-align: center;">
                    <i class="fas fa-heart"></i> Wedding Information
                </h4>
                <div class="form-group">
                    <label for="wedding-date">Wedding Date</label>
                    <input type="date" id="wedding-date">
                </div>
            </div>

            <!-- Vendor Fields - Additional Business Information -->
            <div class="user-type-fields" id="vendor-fields">
                <h4 style="color: #6b5b95; margin-bottom: 15px; text-align: center;">
                    <i class="fas fa-briefcase"></i> Business Details
                </h4>
                <div class="form-group">
                    <label for="service-type">Service Type *</label>
                    <select id="service-type">
                        <option value="">Select Service Type</option>
                        <option value="Photography">Photography</option>
                        <option value="Catering">Catering</option>
                        <option value="Venue">Venue</option>
                        <option value="Florist">Florist</option>
                        <option value="Music">Music/DJ</option>
                        <option value="Makeup">Makeup Artist</option>
                        <option value="Decor">Decorations</option>
                        <option value="Planner">Wedding Planner</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="business-address">Business Location *</label>
                    <input type="text" id="business-address" placeholder="Enter your business location/city">
                </div>
            </div>

            <!-- Password Fields -->
            <div class="form-group">
                <label for="password">Password *</label>
                <input type="password" id="password" placeholder="Create a password" required>
                <div class="password-strength" id="password-strength"></div>
                <div class="error-message" id="password-error"></div>
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm Password *</label>
                <input type="password" id="confirm-password" placeholder="Confirm your password" required>
                <div class="error-message" id="confirm-error"></div>
            </div>

            <!-- Disclaimer -->
            <div class="disclaimer">
                <input type="checkbox" id="disclaimer-agree" required>
                <label for="disclaimer-agree">
                    I hereby declare that all information provided in this registration form is true, 
                    accurate, and complete to the best of my knowledge. I understand that providing 
                    false information may result in account termination or legal action.
                </label>
            </div>

            <div class="error-message" id="general-error"></div>
            <div class="success-message" id="success-message"></div>
            <div class="loading-message" id="loading-message">
                <i class="fas fa-spinner fa-spin"></i> Creating your account...
            </div>

            <button type="submit" class="signup-button" id="signup-button" disabled>
                Create Account
            </button>

            <p class="login-link">
                Already have an account? <a href="login.html">Sign In</a>
            </p>

            <p class="terms">
                By creating an account, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
            </p>
        </form>
    </div>

    <script type="module">
        // Import Firebase SDK modules
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-app.js";
        import { 
            getAuth, 
            createUserWithEmailAndPassword, 
            sendEmailVerification,
            updateProfile,
            signOut
        } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            setDoc 
        } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-firestore.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBdV0sWvBVy565Xpgqayxc7SBrc8uDtcXQ",
            authDomain: "wedding-planner-39b5b.firebaseapp.com",
            projectId: "wedding-planner-39b5b",
            storageBucket: "wedding-planner-39b5b.appspot.com",
            messagingSenderId: "266193524534",
            appId: "1:266193524534:web:b5266631f8052d65704597"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // DOM Elements
        const userTypeSelect = document.getElementById('user-type');
        const clientFields = document.getElementById('client-fields');
        const vendorFields = document.getElementById('vendor-fields');
        const signupForm = document.getElementById('signup-form');
        const signupButton = document.getElementById('signup-button');
        const generalError = document.getElementById('general-error');
        const successMessage = document.getElementById('success-message');
        const loadingMessage = document.getElementById('loading-message');
        const disclaimerCheckbox = document.getElementById('disclaimer-agree');

        // Show/hide fields based on user type
        userTypeSelect.addEventListener('change', function() {
            // Hide all fields first
            clientFields.classList.remove('active');
            vendorFields.classList.remove('active');

            // Remove required attributes from all dynamic fields
            document.getElementById('service-type').removeAttribute('required');
            document.getElementById('business-address').removeAttribute('required');

            // Show relevant fields
            switch(this.value) {
                case 'client':
                    clientFields.classList.add('active');
                    break;
                case 'vendor':
                    vendorFields.classList.add('active');
                    // Add required attributes for vendor fields
                    document.getElementById('service-type').setAttribute('required', '');
                    document.getElementById('business-address').setAttribute('required', '');
                    break;
            }

            validateForm();
        });

        // Form validation
        function validateForm() {
            const userType = userTypeSelect.value;
            const disclaimerChecked = disclaimerCheckbox.checked;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const email = document.getElementById('email').value;
            const businessName = document.getElementById('business-name').value;
            const phone = document.getElementById('phone').value;

            let isValid = true;

            // Basic validation
            if (!userType || !disclaimerChecked || !businessName || !email || !phone) {
                isValid = false;
            }

            // User type specific validation
            if (userType === 'vendor') {
                const serviceType = document.getElementById('service-type').value;
                const businessAddress = document.getElementById('business-address').value;
                if (!serviceType || !businessAddress) {
                    isValid = false;
                }
            }

            // Password validation
            if (password.length < 6) {
                isValid = false;
            }

            if (password !== confirmPassword) {
                isValid = false;
            }

            // Email validation
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                isValid = false;
            }

            signupButton.disabled = !isValid;
            return isValid;
        }

        // Add event listeners for real-time validation
        document.querySelectorAll('input, select').forEach(element => {
            element.addEventListener('input', validateForm);
        });
        disclaimerCheckbox.addEventListener('change', validateForm);

        // Password Strength Checker
        document.getElementById('password').addEventListener('input', function() {
            const password = this.value;
            const strengthElement = document.getElementById('password-strength');
            
            if (password.length === 0) {
                strengthElement.textContent = '';
                return;
            }

            let strength = 'Weak';
            let strengthClass = 'strength-weak';

            if (password.length >= 8) {
                const hasUpperCase = /[A-Z]/.test(password);
                const hasLowerCase = /[a-z]/.test(password);
                const hasNumbers = /\d/.test(password);
                const hasSpecialChar = /[!@#$%^&*(),.?":{}|<>]/.test(password);

                const requirementsMet = [hasUpperCase, hasLowerCase, hasNumbers, hasSpecialChar].filter(Boolean).length;

                if (requirementsMet >= 3 && password.length >= 10) {
                    strength = 'Strong';
                    strengthClass = 'strength-strong';
                } else if (requirementsMet >= 2) {
                    strength = 'Medium';
                    strengthClass = 'strength-medium';
                }
            }

            strengthElement.textContent = `Password strength: ${strength}`;
            strengthElement.className = `password-strength ${strengthClass}`;
            
            validateForm();
        });

        // Confirm Password Validation
        document.getElementById('confirm-password').addEventListener('input', function() {
            const password = document.getElementById('password').value;
            const confirmPassword = this.value;
            const confirmError = document.getElementById('confirm-error');

            if (confirmPassword && password !== confirmPassword) {
                confirmError.textContent = 'Passwords do not match';
                confirmError.style.display = 'block';
            } else {
                confirmError.style.display = 'none';
            }
            
            validateForm();
        });

        // Sign-Up Handling
        signupForm.addEventListener('submit', async function(event) {
            event.preventDefault();
            
            console.log("Form submission started");
            
            if (!validateForm()) {
                console.log("Form validation failed");
                generalError.textContent = 'Please fill in all required fields correctly';
                generalError.style.display = 'block';
                return;
            }

            console.log("Form validation passed, proceeding with signup...");

            // Collect form data
            const formData = {
                businessName: document.getElementById('business-name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                userType: userTypeSelect.value,
                password: document.getElementById('password').value,
                createdAt: new Date().toISOString()
            };

            // Add user type specific data
            if (formData.userType === 'client') {
                formData.weddingDate = document.getElementById('wedding-date').value;
            } else if (formData.userType === 'vendor') {
                formData.serviceType = document.getElementById('service-type').value;
                formData.businessAddress = document.getElementById('business-address').value;
                formData.vendorStatus = 'pending'; // Default status
            }

            // Show loading state
            signupButton.disabled = true;
            loadingMessage.style.display = 'block';
            generalError.style.display = 'none';

            try {
                console.log("Creating user account...");
                
                // Create user in Firebase Auth
                const userCredential = await createUserWithEmailAndPassword(auth, formData.email, formData.password);
                const user = userCredential.user;

                console.log("User created:", user.uid);
                
                // Create user profile in Firestore
                const userProfile = {
                    businessName: formData.businessName,
                    email: formData.email,
                    phone: formData.phone,
                    userType: formData.userType,
                    createdAt: formData.createdAt,
                    profileComplete: true,
                    emailVerified: false
                };

                // Add user type specific fields to users collection
                if (formData.userType === 'client') {
                    userProfile.weddingDate = formData.weddingDate;
                } else if (formData.userType === 'vendor') {
                    userProfile.serviceType = formData.serviceType;
                    userProfile.businessAddress = formData.businessAddress;
                    userProfile.vendorStatus = formData.vendorStatus;
                }

                console.log("Saving user profile to Firestore...");
                
                // Save user profile to Firestore users collection
                await setDoc(doc(db, 'users', user.uid), userProfile);

                // If user is a vendor, also create a vendor profile
                if (formData.userType === 'vendor') {
                    const vendorProfile = {
                        userId: user.uid,
                        name: formData.businessName,
                        email: formData.email,
                        phone: formData.phone,
                        category: formData.serviceType,
                        location: formData.businessAddress,
                        description: `Professional ${formData.serviceType} services`,
                        price: 200, // Default price
                        priceRange: '$$', // Default price range
                        rating: 4.5, // Default rating
                        experience: 1, // Default experience
                        isApproved: false, // Needs admin approval
                        isPremium: false,
                        status: 'active',
                        profileViews: 0,
                        inquiryCount: 0,
                        createdAt: new Date().toISOString(),
                        updatedAt: new Date().toISOString()
                    };
                    
                    await setDoc(doc(db, 'vendors', user.uid), vendorProfile);
                }

                console.log("User profile saved successfully");

                // Update Firebase Auth profile with business/individual name
                await updateProfile(user, {
                    displayName: formData.businessName
                });

                console.log("Sending email verification...");
                
                // Send email verification
                await sendEmailVerification(user);
                
                console.log("Email verification sent successfully");

                // Sign out the user immediately after signup
                await signOut(auth);
                
                // Show success message
                successMessage.innerHTML = `
                    <h3>Account Created Successfully!</h3>
                    <p>A verification email has been sent to <strong>${formData.email}</strong>.</p>
                    <p>Please check your inbox (and spam folder) and click the verification link to activate your account.</p>
                    <p><em>You must verify your email before you can log in.</em></p>
                `;
                successMessage.style.display = 'block';

                // Clear form
                signupForm.reset();
                clientFields.classList.remove('active');
                vendorFields.classList.remove('active');
                signupButton.disabled = true;

                // Store user type for login redirection
                localStorage.setItem('pendingUserType', formData.userType);

                // Redirect to login page after delay
                setTimeout(() => {
                    window.location.href = 'login.html?message=signup_success';
                }, 5000);

            } catch (error) {
                console.error('Signup error:', error);
                
                let errorMessage = 'Signup failed. Please try again.';
                
                switch (error.code) {
                    case 'auth/email-already-in-use':
                        errorMessage = 'An account with this email already exists.';
                        break;
                    case 'auth/invalid-email':
                        errorMessage = 'Please enter a valid email address.';
                        break;
                    case 'auth/weak-password':
                        errorMessage = 'Password is too weak. Please choose a stronger password.';
                        break;
                    case 'auth/network-request-failed':
                        errorMessage = 'Network error. Please check your connection and try again.';
                        break;
                    case 'auth/operation-not-allowed':
                        errorMessage = 'Email/password accounts are not enabled. Please contact support.';
                        break;
                }

                generalError.textContent = errorMessage;
                generalError.style.display = 'block';
            } finally {
                signupButton.disabled = false;
                loadingMessage.style.display = 'none';
            }
        });

        // Enable form interactions
        document.addEventListener('DOMContentLoaded', function() {
            // Add subtle animation to form elements
            const formElements = document.querySelectorAll('.form-group input, .form-group select');
            formElements.forEach((element, index) => {
                element.style.opacity = '0';
                element.style.transform = 'translateY(20px)';
                element.style.transition = `all 0.5s ease ${index * 0.1}s`;
                
                setTimeout(() => {
                    element.style.opacity = '1';
                    element.style.transform = 'translateY(0)';
                }, 100);
            });
        });
    </script>
</body>
</html>
